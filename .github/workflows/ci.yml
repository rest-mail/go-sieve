name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rfc:
    name: Verify RFC / RFC proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache: true
      - name: Build
        run: go build ./...
      - name: Run go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          args: --timeout=5m
      - name: Race coverage, checklist and fuzz proof
        env:
          RFC_PACKAGES: '["./..."]'
          RFC_CHECKLIST_DIRS: '["./pkg/sieve", "./pkg/sieve/internal/grammar", "./pkg/sieve/rfctest"]'
          RFC_FUZZ_TARGETS: >-
            [{"package":"./pkg/sieve","target":"FuzzParse"},
             {"package":"./pkg/sieve/internal/grammar","target":"FuzzDecodeEncodedCharacters"},
             {"package":"./pkg/sieve","target":"FuzzBodyContentTypeSelection"},
             {"package":"./pkg/sieve","target":"FuzzComparatorIdentifier"},
             {"package":"./pkg/sieve","target":"FuzzMatchesReference"},
             {"package":"./pkg/sieve","target":"FuzzASCIINumericReference"},
             {"package":"./pkg/sieve","target":"FuzzSieveNumberReference"}]
        run: python3 -B .github/scripts/rfc_verification.py
      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz"

  fixtures:
    name: Workflow fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/tests -v

  # Preserve the existing required context. Skipped/cancelled proof jobs must
  # never produce a successful Build & Test verdict.
  build:
    name: Build & Test
    needs: [rfc, fixtures]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RFC_RESULT: ${{ needs.rfc.result }}
          FIXTURE_RESULT: ${{ needs.fixtures.result }}
        run: test "$RFC_RESULT" = success && test "$FIXTURE_RESULT" = success
